<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Perodua Commission</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#111}
main{max-width:560px;margin:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 2px 12px #ddd}
h1{text-align:center;margin:5px 0 24px;font-size:32px}label{font-weight:700;display:block;margin:14px 0 7px;font-size:18px}
select{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:17px;background:#fff}
.row{display:flex;justify-content:space-between;gap:12px;padding:15px 2px;border-bottom:1px solid #eee}
.v{font-weight:700;text-align:right}.res{margin-top:20px;border-top:2px solid #eee}
</style></head><body><main>
<h1>Perodua Commission</h1>
<label>Car Model</label><select id="m"><option value="">Select Car Model</option></select>
<label>Variant</label><select id="v" disabled><option value="">Select Variant</option></select>
<div class="res" id="r"></div></main>
<script>
const D={"Axia":{"1.0 E":["RM0","No Support","RM500*","—","—"],"1.0 G":["RM350","RM500","RM500*","—","—"],"1.0 X":["RM450","RM500","RM500*","—","—"],"1.0 SE":["RM500","RM500","RM500*","—","—"],"1.0 AV":["RM550","RM500","RM500*","—","—"]},"Alza":{"1.5 H":["RM700","RM500","—","—","—"],"1.5 AV":["RM750","RM500","—","—","—"],"1.5 X":["RM650","RM500","—","—","—"]},"Aruz":{"1.5 X":["RM850","RM500","RM4000*","—","RM2000"],"1.5 AV":["RM950","RM500","RM4000*","—","RM2000"]},"Ativa":{"1.0 X":["RM600","RM500","RM9500*","—","RM1500"],"1.0 AV":["RM800","RM500","RM5700*","—","RM1500"],"1.0 H":["RM700","RM500","RM5500*","—","RM1500"]},"Bezza":{"1.3 X":["RM450","RM500","RM1500*","—","RM500"],"1.3 AV":["RM550","RM500","RM1500*","—","RM500"],"1.0 G":["RM250","RM500","RM500*","—","RM500"],"1.0 G MT":["RM250","RM500","RM500*","—","RM500"]},"Myvi":{"1.5 X":["RM450","RM500","RM1500*","—","—"],"1.5 G":["RM350","RM500","RM1500*","—","—"],"1.5 H":["RM500","RM500","RM1500*","—","—"],"1.5 AV":["RM600","RM500","RM1500*","—","—"]},"Traz":{"1.5 H":["RM870","RM500","—","—","—"],"1.5 X":["RM810","RM500","—","—","—"]},"QVE":{"QVE":["RM900","RM500","RM6500 + RM10000","—","—"]}};const L=["Commission", "Additional Support", "HQ Promo", "HQ Promo 2", "Extra Discount"];
const m=document.getElementById("m"),v=document.getElementById("v"),r=document.getElementById("r");
Object.keys(D).forEach(x=>m.add(new Option(x,x)));
m.onchange=()=>{v.innerHTML='<option value="">Select Variant</option>';v.disabled=!m.value;r.innerHTML="";
if(m.value)Object.keys(D[m.value]).forEach(x=>v.add(new Option(x,x)));};
v.onchange=()=>{if(!v.value){r.innerHTML="";return;}
r.innerHTML=D[m.value][v.value].map((x,i)=>'<div class="row"><span>'+L[i]+'：</span><span class="v">'+x+'</span></div>').join("");};
</script></body></html>
